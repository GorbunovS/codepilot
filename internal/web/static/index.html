<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodePilot</title>
<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
  :root { --accent: rgb(137, 251, 213); --border: #ddd; --muted: #777; }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #fff; color: #111; }
  #app { display: flex; height: 100vh; }

  /* сайдбар */
  .sidebar { width: 240px; flex: 0 0 240px; border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  .sidebar h1 { font-size: 15px; padding: 16px; border-bottom: 1px solid var(--border); letter-spacing: .5px; }
  .proj-list { flex: 1; overflow-y: auto; }
  .proj { padding: 10px 16px; cursor: pointer; border-bottom: 1px solid #f0f0f0; font-size: 13px; word-break: break-all; }
  .proj:hover { background: #f7f7f7; }
  .proj.active { background: var(--accent); }
  .proj .del { float: right; color: var(--muted); }
  .proj .del:hover { color: #000; }
  .sidebar footer { border-top: 1px solid var(--border); padding: 12px; }
  button { font: inherit; padding: 6px 12px; background: #fff; border: 1px solid #111; cursor: pointer; }
  button:hover { background: #111; color: #fff; }
  button.wide { width: 100%; }
  button:disabled { opacity: .4; cursor: default; }
  select { font: inherit; padding: 5px 8px; background: #fff; border: 1px solid #111; }
  .hint { font-size: 11px; color: var(--muted); margin-left: 8px; }

  /* контент */
  .content { flex: 1; overflow-y: auto; padding: 24px; }
  .content h2 { font-size: 18px; margin-bottom: 4px; word-break: break-all; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 20px; }
  .empty { color: var(--muted); margin-top: 40px; text-align: center; }
  section { margin-bottom: 28px; }
  section h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 10px; }
  .cards { display: flex; gap: 12px; flex-wrap: wrap; }
  .card { border: 1px solid var(--border); padding: 12px 18px; min-width: 130px; }
  .card .num { font-size: 22px; font-weight: 600; }
  .card .num.acc { background: var(--accent); padding: 0 4px; }
  .card .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; margin-top: 4px; }
  .chart-box { border: 1px solid var(--border); padding: 12px; margin-bottom: 12px; max-width: 640px; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  th, td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
  th { color: var(--muted); font-weight: 600; }
  pre.log { background: #fafafa; border: 1px solid var(--border); padding: 12px; font: 12px/1.5 ui-monospace, Menlo, monospace; max-height: 240px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
  pre.snippet { border: 1px solid var(--border); padding: 12px; font: 12px/1.5 ui-monospace, Menlo, monospace; overflow-x: auto; }
  pre.snippet.fresh { border-color: #000; box-shadow: 0 0 0 3px var(--accent); }
  .bar { height: 6px; background: #eee; margin: 8px 0 16px; max-width: 640px; }
  .bar > div { height: 100%; background: var(--accent); transition: width .3s; }
  .err { color: #b00; font-size: 12px; }

  /* проводник */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.3); display: flex; align-items: center; justify-content: center; }
  .modal { background: #fff; border: 1px solid #111; width: 480px; max-height: 70vh; display: flex; flex-direction: column; }
  .modal header { padding: 12px 16px; border-bottom: 1px solid var(--border); font: 12px ui-monospace, Menlo, monospace; word-break: break-all; }
  .modal .dirs { flex: 1; overflow-y: auto; }
  .modal .dir { padding: 8px 16px; cursor: pointer; font-size: 13px; border-bottom: 1px solid #f4f4f4; }
  .modal .dir:hover { background: #f0f0f0; }
  .modal footer { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
  .modal input { flex: 1; font: 12px ui-monospace, Menlo, monospace; padding: 6px 8px; border: 1px solid var(--border); }
</style>
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <h1>CodePilot</h1>
    <div class="proj-list">
      <div v-for="p in projects" :key="p.path" class="proj" :class="{active: p.path === selected}"
           @click="select(p.path)">
        <span class="del" title="убрать из списка" @click.stop="removeProject(p.path)">×</span>
        {{ p.path }}
      </div>
      <div v-if="!projects.length" class="proj" style="color:#999">проектов нет</div>
    </div>
    <footer>
      <button class="wide" @click="openBrowser">+ Добавить проект</button>
    </footer>
  </aside>

  <main class="content">
    <div v-if="!selected" class="empty">Добавьте проект слева, чтобы начать.</div>
    <template v-else>
      <h2>{{ selected }}</h2>
      <div class="sub">хранилище: {{ stats.store || 'sqlite' }}<template v-if="stats.index && stats.index.db_mtime"> · индекс обновлён {{ fmtTime(stats.index.db_mtime) }}</template></div>

      <section>
        <h3>Индексация</h3>
        <button @click="startIndex" :disabled="status.indexing">
          {{ status.indexing ? 'Индексация…' : 'Запустить индексацию' }}
        </button>
        <button v-if="status.indexing" @click="cancelIndex" style="margin-left:8px">Отменить</button>
        <select v-model="device" :disabled="status.indexing" style="margin-left:8px">
          <option value="cpu">cpu</option>
          <option value="coreml">coreml</option>
          <option value="cuda">cuda</option>
        </select>
        <span class="hint">coreml на e5 медленнее CPU — для индексации оставляй cpu</span>
        <div class="bar" v-if="status.indexing"><div style="width:100%"></div></div>
        <pre class="log" v-if="status.log && status.log.length">{{ status.log.join('\n') }}</pre>
        <div v-if="status.last_result" class="sub" :class="{err: status.last_result.startsWith('error')}" style="margin-top:8px">
          {{ status.last_result }}
        </div>
      </section>

      <section v-if="stats.index || stats.index_error">
        <h3>Статистика индекса</h3>
        <div v-if="stats.index_error" class="err">{{ stats.index_error }}</div>
        <div class="cards" v-else>
          <div class="card"><div class="num acc">{{ stats.index.files }}</div><div class="lbl">файлов</div></div>
          <div class="card"><div class="num acc">{{ stats.index.chunks }}</div><div class="lbl">чанков</div></div>
          <div class="card" v-if="stats.index.db_bytes != null"><div class="num">{{ fmtBytes(stats.index.db_bytes) }}</div><div class="lbl">index.db</div></div>
        </div>
      </section>

      <section>
        <h3>Нагрузка MCP</h3>
        <div v-if="stats.mcp && stats.mcp.log_error" class="err">лог вызовов недоступен: {{ stats.mcp.log_error }}</div>
        <template v-else-if="stats.mcp">
          <div class="cards">
            <div class="card"><div class="num acc">{{ stats.mcp.total }}</div><div class="lbl">вызовов</div></div>
            <div class="card"><div class="num">{{ stats.mcp.avg_latency_ms.toFixed(1) }} мс</div><div class="lbl">avg latency</div></div>
            <div class="card"><div class="num">{{ fmtBytes(stats.mcp.avg_bytes) }}</div><div class="lbl">avg ответ</div></div>
          </div>
          <div style="height:16px"></div>
          <div class="chart-box"><canvas ref="toolChart"></canvas></div>
          <div class="chart-box"><canvas ref="latChart"></canvas></div>
          <table v-if="stats.mcp.last && stats.mcp.last.length">
            <thead><tr><th>время</th><th>инструмент</th><th>latency, мс</th><th>байт</th></tr></thead>
            <tbody>
              <tr v-for="(c, i) in stats.mcp.last" :key="i">
                <td>{{ fmtTime(c.ts) }}</td><td>{{ c.tool }}</td>
                <td>{{ c.latency_ms }}</td><td>{{ c.response_bytes }}</td>
              </tr>
            </tbody>
          </table>
        </template>
      </section>

      <section>
        <h3>MCP-конфиг для агента</h3>
        <pre class="snippet" :class="{fresh: snippetFresh}">{{ snippet }}</pre>
        <div style="height:10px"></div>
        <button @click="copySnippet">Копировать</button>
        <span v-if="copied" style="margin-left:10px;font-size:12px;color:var(--muted)">скопировано</span>
      </section>
    </template>
  </main>

  <!-- мини-проводник -->
  <div class="modal-bg" v-if="browser.open" @click.self="browser.open = false">
    <div class="modal">
      <header>{{ browser.path }}</header>
      <div class="dirs">
        <div class="dir" v-if="browser.parent !== browser.path" @click="ls(browser.parent)">..</div>
        <div class="dir" v-for="d in browser.dirs" :key="d" @click="ls(join(browser.path, d))">{{ d }}/</div>
        <div class="dir" v-if="!browser.dirs.length" style="color:#999;cursor:default">(нет подкаталогов)</div>
      </div>
      <footer>
        <input v-model="browser.path" @keyup.enter="ls(browser.path)" placeholder="/путь/к/проекту">
        <button @click="ls(browser.path)">Перейти</button>
        <button @click="addProject(browser.path)">Выбрать этот каталог</button>
      </footer>
    </div>
  </div>
</div>

<script>
const { createApp } = Vue;
createApp({
  data() {
    return {
      projects: [],
      selected: '',
      stats: {},
      status: { indexing: false, log: [], last_result: '' },
      device: localStorage.getItem('codepilot.device') || 'cpu',
      snippet: '',
      snippetFresh: false,
      copied: false,
      browser: { open: false, path: '', parent: '', dirs: [] },
      charts: {},
      pollTimer: null,
    };
  },
  async mounted() {
    await this.loadProjects();
  },
  watch: {
    device(v) { localStorage.setItem('codepilot.device', v); },
  },
  methods: {
    async api(method, url, body) {
      const r = await fetch(url, {
        method,
        headers: body ? { 'Content-Type': 'application/json' } : undefined,
        body: body ? JSON.stringify(body) : undefined,
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
      return data;
    },
    async loadProjects() {
      const d = await this.api('GET', '/api/projects');
      this.projects = d.projects || [];
      if (this.projects.length && !this.selected) this.select(this.projects[0].path);
    },
    async select(path) {
      this.selected = path;
      this.snippetFresh = false;
      await Promise.all([this.loadStats(), this.loadStatus(), this.loadSnippet()]);
    },
    async removeProject(path) {
      await this.api('DELETE', '/api/projects?path=' + encodeURIComponent(path));
      if (this.selected === path) { this.selected = ''; this.stopPoll(); }
      await this.loadProjects();
    },
    async openBrowser() {
      this.browser.open = true;
      await this.ls(this.browser.path || '');
    },
    async ls(path) {
      try {
        const d = await this.api('GET', '/api/ls?path=' + encodeURIComponent(path));
        this.browser.path = d.path;
        this.browser.parent = d.parent;
        this.browser.dirs = d.dirs || [];
      } catch (e) { alert(e.message); }
    },
    join(base, d) { return base.replace(/\/+$/, '') + '/' + d; },
    async addProject(path) {
      try {
        await this.api('POST', '/api/projects', { path });
        this.browser.open = false;
        await this.loadProjects();
        this.select(path.startsWith('/') || /^[A-Za-z]:/.test(path) ? path : this.selected);
        // после добавления выбираем именно добавленный (абсолютный путь вернул сервер)
        const p = this.projects.find(p => p.path.endsWith(path) || p.path === path);
        this.select(p ? p.path : this.projects[this.projects.length - 1].path);
      } catch (e) { alert(e.message); }
    },
    async startIndex() {
      try {
        await this.api('POST', '/api/index', { path: this.selected, device: this.device });
        this.startPoll();
      } catch (e) { alert(e.message); }
    },
    async cancelIndex() {
      try {
        await this.api('POST', '/api/index/cancel', { path: this.selected });
      } catch (e) { alert(e.message); }
    },
    startPoll() {
      this.stopPoll();
      this.pollTimer = setInterval(async () => {
        await this.loadStatus();
        if (!this.status.indexing) {
          this.stopPoll();
          this.snippetFresh = this.status.last_result.startsWith('ok');
          await Promise.all([this.loadStats(), this.loadSnippet()]);
        }
      }, 2000);
    },
    stopPoll() { if (this.pollTimer) { clearInterval(this.pollTimer); this.pollTimer = null; } },
    async loadStatus() {
      if (!this.selected) return;
      this.status = await this.api('GET', '/api/status?path=' + encodeURIComponent(this.selected));
      if (this.status.device && this.status.device !== this.device) {
        this.device = this.status.device; // актуальное значение с сервера
      }
      if (this.status.indexing && !this.pollTimer) this.startPoll();
    },
    async loadStats() {
      if (!this.selected) return;
      this.stats = await this.api('GET', '/api/stats?path=' + encodeURIComponent(this.selected));
      this.$nextTick(() => this.drawCharts());
    },
    async loadSnippet() {
      if (!this.selected) return;
      const d = await this.api('GET', '/api/mcp-snippet?path=' + encodeURIComponent(this.selected));
      this.snippet = d.json;
    },
    drawCharts() {
      if (!this.stats.mcp) return;
      const perTool = this.stats.mcp.per_tool || {};
      this.draw('toolChart', {
        type: 'bar',
        data: {
          labels: Object.keys(perTool),
          datasets: [{ data: Object.values(perTool), backgroundColor: '#111' }],
        },
        options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } },
      });
      const recent = this.stats.mcp.recent || [];
      this.draw('latChart', {
        type: 'line',
        data: {
          labels: recent.map(c => c.ts.slice(11, 19)),
          datasets: [{ data: recent.map(c => c.latency_ms), borderColor: '#111', backgroundColor: 'rgb(137,251,213)', fill: true, pointRadius: 2, tension: .2 }],
        },
        options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, title: { display: true, text: 'мс' } } } },
      });
    },
    draw(ref, cfg) {
      const el = this.$refs[ref];
      if (!el) return;
      if (this.charts[ref]) this.charts[ref].destroy();
      this.charts[ref] = new Chart(el, cfg);
    },
    async copySnippet() {
      try {
        await navigator.clipboard.writeText(this.snippet);
        this.copied = true;
        setTimeout(() => (this.copied = false), 1500);
      } catch (e) { alert(e.message); }
    },
    fmtTime(ts) { return ts ? new Date(ts).toLocaleString() : ''; },
    fmtBytes(n) {
      if (n == null) return '';
      if (n < 1024) return n + ' Б';
      if (n < 1 << 20) return (n / 1024).toFixed(1) + ' КБ';
      return (n / (1 << 20)).toFixed(1) + ' МБ';
    },
  },
}).mount('#app');
</script>
</body>
</html>
