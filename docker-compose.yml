# Стенд codepilot: Postgres+pgvector + веб-панель.
#
# Одной командой поднять всё:
#   docker compose up -d
#   # открыть http://localhost:8080
#
# CLI-операции внутри контейнера:
#   docker compose run --rm app index sample_project
#   docker compose run --rm app eval
#   docker compose run --rm app search "запрос" --project sample_project
#   docker compose run --rm -T app serve --project sample_project   # MCP stdio
#
# Модели (~2.5 ГБ) не входят в образ: монтируются из ./models.
# Конфиг и реестр проектов сохраняются в ~/.codepilot на хосте.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: codepilot
      POSTGRES_PASSWORD: codepilot
      POSTGRES_DB: codepilot
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codepilot -d codepilot"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      CODEPILOT_STORE: pg
      CODEPILOT_PG_DSN: postgres://codepilot:codepilot@db:5432/codepilot?sslmode=disable
      CODEPILOT_EMBED: onnx
      CODEPILOT_ONNXRUNTIME_DLL: /usr/local/lib/libonnxruntime.so
      HOME: /tmp/home   # для хранения ~/.codepilot внутри volume
    volumes:
      - codepilot-home:/tmp/home
      - ./models:/work/models:ro
      - ./sample_project:/work/sample_project
      - ./eval:/work/eval
      - ./mcp-calls.jsonl:/work/mcp-calls.jsonl
    command: ["web", "--addr", "0.0.0.0:8080", "--log", "/work/mcp-calls.jsonl"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/projects || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      CODEPILOT_STORE: pg
      CODEPILOT_PG_DSN: postgres://codepilot:codepilot@db:5432/codepilot?sslmode=disable
      CODEPILOT_EMBED: onnx
      CODEPILOT_ONNXRUNTIME_DLL: /usr/local/lib/libonnxruntime.so
      HOME: /tmp/home
    volumes:
      - codepilot-home:/tmp/home
      - ./models:/work/models:ro
      - ./sample_project:/work/sample_project
      - ./eval:/work/eval
      - ./mcp-calls.jsonl:/work/mcp-calls.jsonl
    stdin_open: true
    profiles: ["cli"]

volumes:
  pgdata:
  codepilot-home:
