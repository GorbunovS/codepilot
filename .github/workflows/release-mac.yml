name: release-mac

on:
  push:
    branches: [prod]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build .pkg
        run: |
          VERSION="v$(date +%Y.%m.%d-%H%M)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          python3 scripts/build_macos.py --version "$VERSION"

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ env.VERSION }}" \
            installers/mac/CodePilot-macOS.pkg \
            --title "CodePilot macOS ${{ env.VERSION }}" \
            --notes "Автосборка с ветки prod" \
            --target prod
